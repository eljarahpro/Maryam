<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maryam Life</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

<style>
:root{
  --bg:#f8f9fa; --card:#fff; --ink:#2b2d42; --mut:#8d99ae; --line:#edf2f4; 
  /* الألوان الأساسية سيتم تغييرها برمجياً */
  --ac:#d9658f; --acs:#fbe3ec; --lav:#ece6f7; 
  --sh:0 8px 30px rgba(150,90,120,.08);
  --urg:#ef233c; --imp:#f77f00; --nor:#2a9d8f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1a24;--card:#252535;--ink:#f1faee;--mut:#a8b2c1;--line:#3a3a4f;--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1a1a24;--card:#252535;--ink:#f1faee;--mut:#a8b2c1;--line:#3a3a4f;--sh:none;}
:root[data-theme=light]{--bg:#f8f9fa;--card:#fff;--ink:#2b2d42;--mut:#8d99ae;--line:#edf2f4;--sh:0 8px 30px rgba(0,0,0,.04);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;font-size:15px;overflow-x:hidden; transition:background 0.3s;}
h1,h2,h3{font-family:'Cairo',serif;margin:0;font-weight:700;letter-spacing:-0.5px;}

/* القائمة الجانبية */
nav{width:250px;background:var(--card);border-inline-end:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0;z-index:10; transition:background 0.3s, border 0.3s;}
nav .logo{font:800 26px 'Cairo',serif;color:var(--ac);padding:10px 12px 25px; text-align: center; border-bottom:1px solid var(--line); margin-bottom:15px;}
nav button{all:unset;cursor:pointer;padding:12px 16px;border-radius:12px;color:var(--mut);display:flex;gap:14px;align-items:center;font-size:15px; font-weight:700; transition:0.2s;}
nav button:hover{background:var(--bg);color:var(--ac);}
nav button.on{background:var(--ac);color:#fff;box-shadow:0 4px 15px rgba(0,0,0,0.15);}
nav button i {font-size:18px; width:24px; text-align:center;}

main{flex:1;padding:30px;max-width:1100px;margin:auto;width:100%;min-width:0; position:relative;}

/* الكروت والتخطيط */
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--sh);margin-bottom:20px;border:1px solid var(--line); position:relative; transition:background 0.3s, border 0.3s;}
.card-hover{transition:0.3s; cursor:pointer;}
.card-hover:hover{transform:translateY(-5px); border-color:var(--ac); box-shadow:0 12px 40px rgba(0,0,0,0.1);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.hero{background:var(--ac); background-image:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.1)); border-radius:24px;padding:35px;margin-bottom:24px; color:#fff;box-shadow:0 8px 25px rgba(0,0,0,0.15); transition:background 0.3s;}
.hero h1{font-size:32px;color:#fff;}.hero p{margin:8px 0 0;font-size:16px; opacity:0.9;}

/* صندوق الرسائل */
.msg-box{background:var(--card); border:2px dashed var(--ac); border-radius:20px; padding:20px; text-align:center; cursor:pointer; transition:0.4s; margin-bottom:24px; color:var(--ac); font-family:'Cairo'; font-weight:700; font-size:18px;}
.msg-box:hover{background:var(--acs);}
.msg-box .content{display:none; color:var(--ink); font-size:20px; line-height:1.6;}
.msg-box.open{background:var(--acs); border-style:solid;}
.msg-box.open .content{display:block; animation:fadeIn 0.6s ease;}
.msg-box.open .front{display:none;}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* المهام والعناصر */
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line);transition:background 0.2s;border-radius:10px;}
.row:hover{background:var(--bg);}
.row:last-child{border:0}
.row .t{flex:1;min-width:0}.done .t-title{text-decoration:line-through;color:var(--mut)}
.done-row {opacity:0.6;}

.btn{all:unset;cursor:pointer;background:var(--ac);color:#fff;padding:12px 24px;border-radius:12px;font-size:15px; font-family:'Tajawal',sans-serif; font-weight:700; text-align:center; display:inline-flex; align-items:center; justify-content:center; gap:10px; transition:0.2s;}
.btn:hover{filter:brightness(0.9); transform:translateY(-2px); box-shadow:0 4px 15px rgba(0,0,0,0.15);}
.btn.g{background:var(--line);color:var(--ink);box-shadow:none;}
.btn.g:hover{background:var(--mut);color:#fff; filter:none;}
.ic{all:unset;cursor:pointer;color:var(--mut);padding:8px;font-size:16px;border-radius:8px;transition:0.2s; display:flex;align-items:center;justify-content:center;}
.ic:hover{background:var(--line);color:var(--ac);}

input,select,textarea{font:inherit;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%;transition:0.3s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs);}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px;}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .6s ease;}

/* مؤشرات الأولوية */
.pri-2 {color: var(--urg);} .pri-1 {color: var(--imp);} .pri-0 {color: var(--nor);}

/* الجدول الأسبوعي */
.table-wrapper {overflow-x:auto; background:var(--card); border-radius:16px; border:1px solid var(--line); box-shadow:var(--sh);}
.st-table {width:100%; border-collapse:collapse; min-width:600px;}
.st-th {background:var(--bg); color:var(--mut); padding:16px; text-align:right; font-family:'Cairo'; font-weight:700; border-bottom:2px solid var(--line);}
.st-td {padding:16px; border-bottom:1px solid var(--line); vertical-align:top;}
.st-tr:last-child .st-td {border-bottom:0;}
.st-tr:hover {background:var(--bg);}
.st-day {font-weight:700; font-size:16px; color:var(--ink); display:block;}
.st-date {font-size:12px; color:var(--mut);}

/* العادات */
.habit-grid {display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; margin-top:12px;}
.habit-day {aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--line); color:var(--mut); cursor:pointer; transition:0.2s; font-size:12px; font-weight:bold;}
.habit-day:hover {background:var(--mut); color:#fff;}
.habit-day.active {background:var(--ac); color:#fff; box-shadow:0 0 10px var(--acs);}

/* ======= شاشة التحميل الرومانسية باللون البنفسجي ======= */
#loader {
  position: fixed; inset: 0;
  background: radial-gradient(circle at center, #240046 0%, #10002b 100%);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
  transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.77, 0, 0.175, 1);
  overflow: hidden;
}

/* التوهج الخلفي */
.loader-bg-glow {
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(157, 78, 221, 0.2) 0%, transparent 70%);
  border-radius: 50%;
  animation: pulseGlow 4s infinite alternate ease-in-out;
}

/* القلوب المتطايرة */
.floating-hearts {
  position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none;
}
.floating-hearts i {
  position: absolute; bottom: -50px; left: var(--x);
  color: rgba(224, 170, 255, 0.25);
  font-size: calc(24px * var(--s));
  animation: floatUp 7s linear infinite;
  animation-delay: var(--d);
  filter: drop-shadow(0 0 10px rgba(224, 170, 255, 0.4));
}

/* الصندوق الرئيسي للاسم */
.loader-box {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  animation: floatContainer 6s ease-in-out infinite;
}

/* حلقات النبض البنفسجية خلف الاسم */
.pulse-ring {
  position: absolute;
  top: 40%; left: 50%;
  width: 140px; height: 140px;
  border-radius: 50%;
  border: 2px solid rgba(157, 78, 221, 0.6);
  animation: beatingRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
  z-index: -1;
}
.pulse-ring.delay {
  animation-delay: 1.5s;
}

/* تصميم الاسم الجذاب */
#loader-name {
  font-family: 'Playfair Display', serif; 
  font-size: 60px; font-weight: 600; 
  letter-spacing: 12px; margin: 0; 
  background: linear-gradient(90deg, #e0aaff, #c77dff, #e0aaff);
  background-size: 200% auto;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  animation: shineText 4s linear infinite, revealText 2s forwards ease-out;
  text-shadow: 0 0 40px rgba(157, 78, 221, 0.5);
}

/* الخط المضيء */
.loader-line {
  width: 0; height: 2px;
  background: linear-gradient(90deg, transparent, #c77dff, transparent);
  margin-top: 15px;
  animation: drawLine 2.5s forwards ease 1.5s;
  box-shadow: 0 0 15px #c77dff;
}

/* ظهور المقولة */
#loader-quote {
  margin-top: 25px; color: #e0aaff; font-family: 'Cairo', sans-serif; font-size: 17px; 
  text-align: center; font-weight: 600; opacity: 0; 
  animation: revealQuote 2s forwards ease-out 2s; 
  max-width: 80%; line-height: 1.6;
}

/* الحركات (Keyframes) */
@keyframes floatUp {
  0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 0.8; }
  100% { transform: translateY(-100vh) scale(1.5) rotate(45deg); opacity: 0; }
}
@keyframes beatingRing {
  0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; border-width: 4px; box-shadow: 0 0 30px rgba(157, 78, 221, 0.5); }
  100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; border-width: 1px; }
}
@keyframes pulseGlow { 
  0% { transform: scale(0.8); opacity: 0.5; } 
  100% { transform: scale(1.2); opacity: 1; } 
}
@keyframes floatContainer { 
  0%, 100% { transform: translateY(0); } 
  50% { transform: translateY(-15px); } 
}
@keyframes shineText { 
  to { background-position: 200% center; } 
}
@keyframes revealText { 
  0% { opacity: 0; transform: translateY(25px); filter: blur(8px); } 
  100% { opacity: 1; transform: translateY(0); filter: blur(0); } 
}
@keyframes drawLine { to { width: 140px; } }
@keyframes revealQuote { 
  0% { opacity: 0; transform: translateY(15px); filter: blur(5px); } 
  100% { opacity: 1; transform: translateY(0); filter: blur(0); } 
}
/* ======================================================== */


/* ===== المناسبات: التبويبات + الكروت + عارض الوسائط ===== */
.seg{display:flex;gap:6px;background:var(--line);padding:6px;border-radius:16px;margin-bottom:24px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:12px 8px;border-radius:12px;font-weight:800;color:var(--mut);transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.seg button.on{background:var(--card);color:var(--ac);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.ec{padding:0;overflow:hidden;text-align:center;border-top:5px solid var(--ac);display:flex;flex-direction:column;transition:.3s}
.ec.clk{cursor:pointer}
.ec.clk:hover{transform:translateY(-5px);border-color:var(--ac);box-shadow:0 12px 40px rgba(0,0,0,.1)}
.ec.ev{background:linear-gradient(180deg,var(--card) 0%,var(--acs) 150%)}
.ec .cov{height:180px;background:var(--acs);display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:40px;position:relative;overflow:hidden}
.ec .cov img,.ec .cov video{width:100%;height:100%;object-fit:cover;display:block}
.ec .cnt{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.62);color:#fff;border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;display:flex;gap:10px;align-items:center;font-family:'Tajawal',sans-serif}
.ec .bd{padding:20px 20px 26px;display:flex;flex-direction:column;gap:8px;align-items:center}
.ec .acts{position:absolute;top:10px;left:10px;display:flex;gap:2px;z-index:2;background:var(--card);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.ec .ttl{font-size:21px;font-weight:800;color:var(--ac);font-family:'Cairo'}
.ec .dsc{font-size:14px;color:var(--mut);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pend{display:flex;flex-wrap:wrap}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 12px 6px 6px;margin:10px 0 0 10px;max-width:100%}
.pchip img{width:38px;height:38px;object-fit:cover;border-radius:8px}
.pchip>i{width:38px;text-align:center;color:var(--ac);font-size:20px}
.pchip span{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}
.pchip small{font-size:11px}
#viewer{position:fixed;inset:0;z-index:100;background:rgba(10,10,20,.9);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
.vw-box{background:var(--card);color:var(--ink);border-radius:24px;max-width:920px;width:100%;max-height:100%;overflow-y:auto;padding:24px;position:relative}
.vw-x{all:unset;cursor:pointer;position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;z-index:3}
.vw-x:hover{background:var(--ac);color:#fff}
.vw-h{text-align:center;padding:0 46px 16px}
.vw-t{font-family:'Cairo';font-size:24px;font-weight:800;color:var(--ac)}
.vw-stage{position:relative;background:#000;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px}
.vw-stage img,.vw-stage video{max-width:100%;max-height:62vh;display:block}
.vw-n{all:unset;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.vw-n:hover{background:var(--ac)}
.vw-n.r{right:10px}.vw-n.l{left:10px}
.vw-th{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.vw-th div{flex:0 0 64px;height:64px;border-radius:10px;overflow:hidden;cursor:pointer;opacity:.55;border:2px solid transparent;background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.vw-th div.on{opacity:1;border-color:var(--ac)}
.vw-th img{width:100%;height:100%;object-fit:cover}
.vw-files{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.vw-files a{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
.vw-files a:hover{border-color:var(--ac);color:var(--ac)}
.vw-files a i:first-child{color:var(--ac);font-size:20px}

#toast{position:fixed;bottom:100px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:14px 28px;border-radius:12px;opacity:0;transition:.4s;pointer-events:none;z-index:105; font-weight:700; box-shadow:0 10px 40px rgba(0,0,0,0.3); display:flex; align-items:center; gap:10px;}
#toast.s{opacity:1; transform:translateY(-15px);}

@media(max-width:760px){
  body{flex-direction:column}
  nav{position:fixed;bottom:0;inset-inline:0;top:auto;width:100%;height:auto;flex-direction:row;justify-content:space-between;padding:12px 8px calc(12px + env(safe-area-inset-bottom,0px));z-index:90;border-top:1px solid var(--line);background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,0.05); overflow-x:auto;}
  nav .logo{display:none}
  nav button{flex:1; flex-direction:column; gap:6px; font-size:11px; padding:8px 6px; border-radius:12px; white-space:nowrap; justify-content:center; font-weight:700;}
  nav button i {font-size:20px;}
  main{padding:16px 12px 110px}
  #loader-quote {font-size:15px;}
  #loader-name {font-size: 45px;}
}
</style>
</head>
<body>
<!-- شاشة التحميل المحدثة -->
<div id="loader">
  <div class="loader-bg-glow"></div>
  <div class="floating-hearts">
    <i class="fa-solid fa-heart" style="--d: 0s; --x: 15%; --s: 1.2;"></i>
    <i class="fa-solid fa-heart" style="--d: 2s; --x: 85%; --s: 0.8;"></i>
    <i class="fa-solid fa-heart" style="--d: 4s; --x: 50%; --s: 1.5;"></i>
    <i class="fa-solid fa-heart" style="--d: 1s; --x: 30%; --s: 0.9;"></i>
    <i class="fa-solid fa-heart" style="--d: 3s; --x: 70%; --s: 1.1;"></i>
    <i class="fa-solid fa-heart" style="--d: 5s; --x: 10%; --s: 1.3;"></i>
    <i class="fa-solid fa-heart" style="--d: 2.5s; --x: 90%; --s: 1;"></i>
  </div>
  <div class="loader-box">
    <div class="pulse-ring"></div>
    <div class="pulse-ring delay"></div>
    <h1 id="loader-name">Maryam</h1>
    <div class="loader-line"></div>
    <div id="loader-quote"></div>
  </div>
</div>

<nav id="nav"></nav>
<main id="app"></main>
<div id="toast"></div>
<div id="viewer" onclick="closeView()"></div>

<script>
// الألوان المتاحة للتطبيق
const ACCENTS = [
  { name: 'وردي (الافتراضي)', ac: '#d9658f', acsL: '#fbe3ec', acsD: '#4a2d3d' },
  { name: 'بنفسجي لافندر', ac: '#8b78a5', acsL: '#ece6f7', acsD: '#383050' },
  { name: 'أخضر نعناعي', ac: '#2a9d8f', acsL: '#e2f4f2', acsD: '#1d423e' },
  { name: 'أزرق سماوي', ac: '#457b9d', acsL: '#e1eff7', acsD: '#1f384a' },
  { name: 'خوخي دافئ', ac: '#f4a261', acsL: '#fdf1e8', acsD: '#5e381f' }
];

const quotes = [
  "تذكري دائماً أنكِ قادرة على تحقيق المستحيل 🌟",
  "كل خطوة صغيرة هي تقدم نحو هدفك 🌸",
  "لا تستسلمي، البدايات دائماً هي الأصعب 💪",
  "أنتِ تصنعين مستقبلك اليوم، استمري! ✨",
  "ثقي بنفسك وبقدراتك، العالم يفتح أبوابه لكِ 🌷",
  "ابتسمي.. اليوم سيكون يوماً رائعاً بإذن الله 💖"
];
document.getElementById('loader-quote').textContent = quotes[Math.floor(Math.random() * quotes.length)];

const firebaseConfig = {
  apiKey: "AIzaSyAPlU02h0HsGvD7cq2tRCiN7cDOO2l3Sfo",
  authDomain: "maryam-website-d40ce.firebaseapp.com",
  projectId: "maryam-website-d40ce",
  storageBucket: "maryam-website-d40ce.firebasestorage.app",
  messagingSenderId: "667369258923",
  appId: "1:667369258923:web:e497cb014cba9a356e1cee"
};

let dbFire = null;
let dbStore = null;
let D = {
  settings: { theme:'light', msg:'أنتِ النور الذي يضيء أيامي، وكل يوم معكِ هو بداية جديدة للجمال.', accent:0 },
  items: [], 
  habits: [], 
  events: [], 
  memories: [], 
  notes: []
};

let editEvId = null;
let editNoteId = null; 

const save = () => {
  D._ts = Date.now();
  localStorage.setItem('maryam_life_os_v4', JSON.stringify(D));
  if(dbFire) dbFire.collection('maryam_app').doc('life_os').set(D).catch(e=>{console.log(e); toast('تعذرت المزامنة مع السيرفر');});

const load = async () => {
  const loc = localStorage.getItem('maryam_life_os_v4');
  if(loc) D = {...D, ...JSON.parse(loc)};
  
  if(!D.settings.theme || D.settings.theme === 'auto') D.settings.theme = 'light';
  if(typeof D.settings.accent === 'undefined') D.settings.accent = 0;
  
  if(!D.items) D.items = []; if(!D.habits) D.habits = []; if(!D.events) D.events = []; if(!D.notes) D.notes = [];
  if(!D.memories) D.memories = [];
  // ترحيل لمرة واحدة: المناسبات القديمة بدون عد تنازلي تتحول إلى ذكريات
  let migrated = false;
  if(!D._mig_mem){
    D.events = D.events.filter(e => { if(e.countdown === false){ D.memories.push({id:e.id, title:e.title, date:e.date, desc:'', media:[]}); return false; } return true; });
    D._mig_mem = 1; migrated = true;
  }
  
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    dbFire = firebase.firestore();
    try { dbStore = firebase.storage(); dbStore.setMaxUploadRetryTime(20000); } catch(e) { console.log('storage unavailable', e); }
    if(migrated) save();
    dbFire.collection('maryam_app').doc('life_os').onSnapshot(doc => {
      if(doc.exists) {
        const serverData = doc.data();
        if((serverData._ts||0) >= (D._ts||0) && JSON.stringify(D) !== JSON.stringify(serverData)) {
          D = {...D, ...serverData};
          applyTheme(); render(true);
        }
      }
    });
  } catch(e) { console.error(e); }
};

const fmtSize = n => n>1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1,Math.round((n||0)/1024))+' KB';
const kindOf = (mime,name) => /^image\//.test(mime)||/\.(jpe?g|png|gif|webp|bmp|avif|heic)$/i.test(name||'') ? 'image'
  : /^video\//.test(mime)||/\.(mp4|mov|webm|mkv|m4v|avi|3gp)$/i.test(name||'') ? 'video' : 'file';

// ---- تخزين محلي احتياطي (IndexedDB) ----
const idb = () => new Promise((ok,no)=>{const r=indexedDB.open('maryam_media',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);});
const idbSet = async (k,b) => { const d=await idb(); return new Promise((ok,no)=>{const t=d.transaction('f','readwrite'); t.objectStore('f').put(b,k); t.oncomplete=ok; t.onerror=()=>no(t.error);}); };
const idbGet = async k => { const d=await idb(); return new Promise((ok,no)=>{const q=d.transaction('f').objectStore('f').get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>no(q.error);}); };
const idbDel = async k => { try{ const d=await idb(); d.transaction('f','readwrite').objectStore('f').delete(k); }catch(e){} };

async function hydrate(){
  for(const el of document.querySelectorAll('[data-lid]')){
    const id = el.dataset.lid;
    try{
      if(!blobUrls[id]){ const b = await idbGet(id); if(!b) continue; blobUrls[id] = URL.createObjectURL(b); }
      if(el.tagName==='A') el.href = blobUrls[id]; else el.src = blobUrls[id];
    }catch(e){}
  }
}

// ---- رفع الملفات ----
function compressImg(file){
  return new Promise(res=>{
    if(/gif|svg/i.test(file.type)) return res(file);
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const M=1600; let w=img.naturalWidth, h=img.naturalHeight, sc=Math.min(1,M/Math.max(w,h));
      w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(u); res(b && b.size<file.size ? new File([b], file.name.replace(/\.\w+$/,'')+'.jpg', {type:'image/jpeg'}) : file); }, 'image/jpeg', .85);
    };
    img.onerror=()=>{ URL.revokeObjectURL(u); res(file); };
    img.src=u;
  });
}
async function uploadOne(f){
  const id=uid(); let blob=f;
  if(kindOf(f.type,f.name)==='image') blob = await compressImg(f);
  const mime = blob.type || f.type || 'application/octet-stream';
  const m = {id, name:f.name, mime, size:blob.size, kind:kindOf(mime,f.name)};
  try{
    if(!dbStore) throw new Error('no storage');
    const path = 'maryam_media/'+id+'_'+f.name.replace(/[^\w.\-]/g,'_');
    const ref = dbStore.ref(path);
    await ref.put(blob,{contentType:mime});
    m.url = await ref.getDownloadURL(); m.path = path;
  }catch(e){
    console.log('cloud upload failed, saving locally', e);
    await idbSet(id, blob); m.local = true;
  }
  return m;
}
function delMedia(m){
  if(m.local) idbDel(m.id);
  else if(m.path && dbStore) dbStore.ref(m.path).delete().catch(()=>{});
}

async function saveEntry(k){
  if(busy) return;
  const M = k==='mem', p = M ? 'mm' : 'ev';
  const t = $('#'+p+'-title').value.trim(), d = $('#'+p+'-date').value || today();
  if(!t) return toast(M ? 'اكتبي عنوان الذكرى أولاً' : 'اكتبي اسم المناسبة أولاً');
  busy = true; const btn=$('#'+p+'-save'); if(btn) btn.style.opacity='.6';
  const added=[]; let local=false; const n=pend[k].length;
  for(let i=0;i<n;i++){
    toast('جاري رفع الملف '+(i+1)+' من '+n+'...');
    try{ const m = await uploadOne(pend[k][i]); if(m.local) local=true; added.push(m); }
    catch(e){ console.log(e); toast('تعذر حفظ الملف: '+pend[k][i].name); }
  }
  busy = false;
  const list = M ? D.memories : D.events, eid = M ? editMemId : editEvId;
  const media = [...kept[k], ...added];
  const extra = M ? {desc:($('#mm-desc').value||'').trim()} : {countdown:true};
  const old = eid ? list.find(x=>x.id===eid) : null;
  if(old){
    (old.media||[]).filter(m=>!kept[k].some(x=>x.id===m.id)).forEach(delMedia);
    Object.assign(old, {title:t, date:d, media}, extra);
  } else list.push({id:uid(), title:t, date:d, media, ...extra});
  if(M) editMemId=null; else editEvId=null;
  pend[k]=[]; kept[k]=[];
  save(); render();
  toast(local ? 'تم الحفظ — الملفات على هذا الجهاز فقط (تعذر الرفع للسيرفر)' : (old ? 'تم حفظ التعديلات' : 'تمت الإضافة بنجاح'));

function countdownView(){
  const t = today();
  const all = D.events.filter(e=>e.countdown!==false);
  const up = all.filter(e=>e.date>=t).sort((a,b)=>a.date.localeCompare(b.date));
  const past = all.filter(e=>e.date<t).sort((a,b)=>b.date.localeCompare(a.date));
  const ed = editEvId ? D.events.find(x=>x.id===editEvId) : null;
  return `<div class="card">
      <h3 style="margin-bottom:15px;font-size:16px;"><i class="fa-solid ${ed?'fa-pen':'fa-plus'}"></i> ${ed?'تعديل المناسبة':'إضافة مناسبة قادمة'}</h3>
      <div class="f" style="align-items:center;">
        <input id="ev-title" placeholder="اسم المناسبة (مثال: عيد ميلاد، تخرج، سفر...)" value="${ed?esc(ed.title):''}">
        <input id="ev-date" type="date" value="${ed?ed.date:t}">
      </div>
      ${mediaPicker('ev')}
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        ${ed?`<button class="btn g" onclick="cancelEditEv()">إلغاء</button>`:''}
        <button class="btn" id="ev-save" onclick="saveEntry('ev')"><i class="fa-solid ${ed?'fa-check':'fa-plus'}"></i> ${ed?'حفظ التعديلات':'إضافة للعد التنازلي'}</button>
      </div>
    </div>
    <div class="grid" style="margin-top:20px;">
      ${all.length ? [...up,...past].map(e=>entryCard('cd',e,t)).join('') : '<p class="mut" style="text-align:center;width:100%;grid-column:1/-1;">لا توجد مناسبات قادمة. أضيفي موعداً تنتظرينه!</p>'}

// دوال إدارة المذكرات
function openEditNote(id) { editNoteId = id; go('notes'); }
function cancelEditNote() { editNoteId = null; render(); }
function saveNote() {
  let t = $('#n-title').value.trim(), c = $('#n-content').value.trim();
  if(!c) return toast('لا يمكنك حفظ مذكرة فارغة، اكتبي شيئاً أولاً!');
  if(editNoteId) {
    let n = D.notes.find(x=>x.id==editNoteId);
    if(n) { n.title = t; n.content = c; }
    editNoteId = null; toast('تم حفظ التعديلات');
  } else {
    let timeStr = new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
    D.notes.push({id:uid(), title:t, content:c, date:today(), time:timeStr, ts:Date.now()});
    toast('تم تدوين مذكرتك بحب!');
  }
  save(); render();
}

              <div class="mut" style="font-size:12px;"><i class="fa-regular fa-clock"></i> ${fmtDay(n.date)}، ${fmtDate(n.date)} - ${n.time||''}</div>
            </div>
            <div style="display:flex; gap:5px;">
              <button class="ic" onclick="openEditNote('${n.id}')" title="تعديل"><i class="fa-solid fa-pen"></i></button>
              <button class="ic" onclick="if(confirm('هل أنتِ متأكدة من حذف هذه المذكرة؟')){D.notes=D.notes.filter(x=>x.id!='${n.id}'); save(); render();}" title="حذف"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <div style="white-space:pre-wrap; line-height:1.7; font-size:15px; color:var(--ink); flex:1; width:100%;">${esc(n.content)}</div>
        </div>
      `).join('') : '<p class="mut" style="text-align:center; width:100%; grid-column:1/-1;">لا توجد مذكرات بعد. ابدئي بتدوين يومياتك وخواطرك!</p>'}
    </div>
    `;
  },

  timer(){
    return `<h1><i class="fa-solid fa-stopwatch"></i> مؤقت التركيز (بومودورو)</h1>
    <p class="mut" style="margin-bottom:24px;">قسّمي وقت عملك لفترات للحفاظ على نشاطك. تركيزك اليوم: ${(D.focus&&D.focus.date==today())?D.focus.mins:0} دقيقة</p>
    <div class="card" style="text-align:center; padding:50px 20px;">
      <div id="tt-display" style="font-size:80px; font-weight:700; font-family:'Cairo'; color:var(--ac); line-height:1; margin-bottom:30px;">25:00</div>
      <div style="display:flex; gap:16px; justify-content:center; flex-wrap:wrap;">
        <button class="btn" onclick="startTimer(25)"><i class="fa-solid fa-brain"></i> تركيز (25 د)</button>
        <button class="btn g" onclick="startTimer(5)"><i class="fa-solid fa-mug-hot"></i> راحة (5 د)</button>
        <button class="ic" style="background:var(--line); padding:14px 20px; color:var(--ink);" onclick="stopTimer()" title="إيقاف"><i class="fa-solid fa-stop"></i></button>
      </div>
    </div>`;
  },

  // القسم الخاص بالثيمات والمظهر
  themes(){
    return `
    <h1><i class="fa-solid fa-palette"></i> المظهر (Themes)</h1>
    <p class="mut" style="margin-bottom:20px;">خصصي شكل وألوان التطبيق ليناسب ذوقك.</p>

    <div class="card">
      <h3 style="margin-bottom:15px; font-size:16px;"><i class="fa-solid fa-circle-half-stroke"></i> وضع الإضاءة</h3>
      <div style="display:flex; gap:15px;">
        <button class="btn ${D.settings.theme==='light' ? '' : 'g'}" onclick="setMode('light')">
          <i class="fa-solid fa-sun"></i> الوضع الفاتح
        </button>
        <button class="btn ${D.settings.theme==='dark' ? '' : 'g'}" onclick="setMode('dark')">
          <i class="fa-solid fa-moon"></i> الوضع الداكن
        </button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:15px; font-size:16px;"><i class="fa-solid fa-droplet"></i> الألوان (Accents)</h3>
      <div style="display:flex; gap:15px; flex-wrap:wrap; padding:10px 0;">
        ${ACCENTS.map((c, i) => `
          <div onclick="setAccent(${i})" 
               style="width:50px; height:50px; border-radius:50%; background:${c.ac}; cursor:pointer; 
                      border:3px solid ${D.settings.accent === i ? 'var(--ink)' : 'transparent'}; 
                      box-shadow:0 4px 10px rgba(0,0,0,0.1); transition:0.3s; 
                      transform:${D.settings.accent === i ? 'scale(1.15)' : 'scale(1)'};" 
               title="${c.name}">
          </div>
        `).join('')}
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:15px; font-size:16px;"><i class="fa-solid fa-floppy-disk"></i> نسخة احتياطية</h3>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <button class="btn" onclick="exportData()"><i class="fa-solid fa-download"></i> تصدير بياناتي</button>
        <label class="btn g" style="cursor:pointer;"><i class="fa-solid fa-upload"></i> استيراد<input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label>
      </div>
    </div>
    `;
  }
};

let timerInterval=null, timeRemaining=0, timerEnd=0, timerLen=0;
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain(); o.connect(g); g.connect(a.destination); g.gain.value=.15; o.frequency.value=880; o.start(); o.stop(a.currentTime+.6);}catch(e){}}
function startTimer(minutes){
  clearInterval(timerInterval);
  timerLen=minutes; timerEnd=Date.now()+minutes*60000; timeRemaining=minutes*60;
  updateTimerDisplay();
  timerInterval=setInterval(tickTimer,500);
}
function tickTimer(){
  timeRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));
  updateTimerDisplay();
  if(timeRemaining<=0){
    clearInterval(timerInterval);
    if(timerLen>=25){const t=today(); if(!D.focus||D.focus.date!=t) D.focus={date:t,mins:0}; D.focus.mins+=timerLen; save();}
    beep(); navigator.vibrate&&navigator.vibrate([300,150,300]);
    toast('انتهى الوقت المخصص! عمل رائع.');
  }
}
function stopTimer(){clearInterval(timerInterval); timeRemaining=0; updateTimerDisplay();}
function updateTimerDisplay(){
  const el = document.getElementById('tt-display');
  if(!el) return;
  if(timeRemaining === 0) { el.textContent = "00:00"; return; }
  const m = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
  const s = String(timeRemaining % 60).padStart(2, '0');
  el.textContent = `${m}:${s}`;
}

// تغيير اللون المفضل
function setAccent(idx) {
  D.settings.accent = idx;
  save(); applyTheme(); render(); 
}

// تغيير وضع الداكن/الفاتح
function setMode(m) {
  D.settings.theme = m;
  save(); applyTheme(); render();
}

function applyTheme(){
  const r = document.documentElement;
  let t = D.settings.theme || 'light';
  r.dataset.theme = t;
  
  // تطبيق اللون المفضل
  let accIdx = D.settings.accent !== undefined ? D.settings.accent : 0;
  let c = ACCENTS[accIdx] || ACCENTS[0];
  r.style.setProperty('--ac', c.ac);
  r.style.setProperty('--acs', t === 'dark' ? c.acsD : c.acsL);
}

function render(keep){
  $('#nav').innerHTML=`<div class="logo">Maryam Life</div>` + 
    PAGES.map(([k, icon, l])=>`<button class="${k==page?'on':''}" onclick="go('${k}')"><i class="fa-solid ${icon}"></i> <span>${l}</span></button>`).join('');
    
  const kv={}; if(keep) document.querySelectorAll('#app [id]').forEach(e=>{if(e.id&&e.type!=='checkbox'&&'value' in e) kv[e.id]=e.value});
  const st=window.scrollY; $('#app').innerHTML=views[page](); window.scrollTo(0,st);
  for(const k in kv){const e=document.getElementById(k); if(e&&kv[k]!=='') e.value=kv[k];}
  if(page === 'timer' && timeRemaining > 0) updateTimerDisplay();
  hydrate();
}

load().then(()=>{applyTheme(); render()});
</script>
</body>
</html>
