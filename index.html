<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maryam Life</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#f8f9fa; --card:#fff; --ink:#2b2d42; --mut:#8d99ae; --line:#edf2f4; 
  --ac:#d9658f; --acs:#fbe3ec; --lav:#ece6f7; 
  --sh:0 8px 30px rgba(150,90,120,.08);
  --urg:#ef233c; --imp:#f77f00; --nor:#2a9d8f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1a24;--card:#252535;--ink:#f1faee;--mut:#a8b2c1;--line:#3a3a4f;--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1a1a24;--card:#252535;--ink:#f1faee;--mut:#a8b2c1;--line:#3a3a4f;--sh:none;}
:root[data-theme=light]{--bg:#f8f9fa;--card:#fff;--ink:#2b2d42;--mut:#8d99ae;--line:#edf2f4;--sh:0 8px 30px rgba(0,0,0,.04);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;font-size:15px;overflow-x:hidden; transition:background 0.3s;}
h1,h2,h3{font-family:'Cairo',serif;margin:0;font-weight:700;letter-spacing:-0.5px;}

/* القائمة الجانبية */
nav{width:250px;background:var(--card);border-inline-end:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0;z-index:10; transition:background 0.3s, border 0.3s;}
nav .logo{font:800 26px 'Cairo',serif;color:var(--ac);padding:10px 12px 15px; text-align: center; border-bottom:1px solid var(--line); margin-bottom:10px;}
nav button{all:unset;cursor:pointer;padding:12px 16px;border-radius:12px;color:var(--mut);display:flex;gap:14px;align-items:center;font-size:15px; font-weight:700; transition:0.2s;}
nav button:hover{background:var(--bg);color:var(--ac);}
nav button.on{background:var(--ac);color:#fff;box-shadow:0 4px 15px rgba(0,0,0,0.15);}
nav button i {font-size:18px; width:24px; text-align:center;}

/* مؤشر المزامنة */
.sync-badge {
  display:flex; align-items:center; justify-content:center; gap:8px;
  font-size:12px; font-weight:700; padding:8px 12px; border-radius:10px;
  background:var(--bg); color:var(--mut); margin-bottom:10px; cursor:pointer;
  border:1px solid var(--line); transition:0.2s;
}
.sync-badge:hover { border-color:var(--ac); color:var(--ink); }
.sync-dot { width:8px; height:8px; border-radius:50%; background:#8d99ae; display:inline-block; }
.sync-dot.online { background:#2a9d8f; box-shadow:0 0 8px #2a9d8f; }
.sync-dot.syncing { background:#f77f00; animation: pulse 1s infinite; }
.sync-dot.offline { background:#ef233c; }

main{flex:1;padding:30px;max-width:1100px;margin:auto;width:100%;min-width:0; position:relative;}

/* الكروت والتخطيط */
.card{background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--sh);margin-bottom:20px;border:1px solid var(--line); position:relative; transition:background 0.3s, border 0.3s;}
.card-hover{transition:0.3s; cursor:pointer;}
.card-hover:hover{transform:translateY(-5px); border-color:var(--ac); box-shadow:0 12px 40px rgba(0,0,0,0.1);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.hero{background:var(--ac); background-image:linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.1)); border-radius:24px;padding:35px;margin-bottom:24px; color:#fff;box-shadow:0 8px 25px rgba(0,0,0,0.15); transition:background 0.3s;}
.hero h1{font-size:32px;color:#fff;}.hero p{margin:8px 0 0;font-size:16px; opacity:0.9;}

/* صندوق الرسائل */
.msg-box{background:var(--card); border:2px dashed var(--ac); border-radius:20px; padding:20px; text-align:center; cursor:pointer; transition:0.4s; margin-bottom:24px; color:var(--ac); font-family:'Cairo'; font-weight:700; font-size:18px;}
.msg-box:hover{background:var(--acs);}
.msg-box .content{display:none; color:var(--ink); font-size:20px; line-height:1.6;}
.msg-box.open{background:var(--acs); border-style:solid;}
.msg-box.open .content{display:block; animation:fadeIn 0.6s ease;}
.msg-box.open .front{display:none;}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* المهام والعناصر */
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line);transition:background 0.2s;border-radius:10px;}
.row:hover{background:var(--bg);}
.row:last-child{border:0}
.row .t{flex:1;min-width:0}.done .t-title{text-decoration:line-through;color:var(--mut)}
.done-row {opacity:0.6;}

.btn{all:unset;cursor:pointer;background:var(--ac);color:#fff;padding:12px 24px;border-radius:12px;font-size:15px; font-family:'Tajawal',sans-serif; font-weight:700; text-align:center; display:inline-flex; align-items:center; justify-content:center; gap:10px; transition:0.2s;}
.btn:hover{filter:brightness(0.9); transform:translateY(-2px); box-shadow:0 4px 15px rgba(0,0,0,0.15);}
.btn.g{background:var(--line);color:var(--ink);box-shadow:none;}
.btn.g:hover{background:var(--mut);color:#fff; filter:none;}
.ic{all:unset;cursor:pointer;color:var(--mut);padding:8px;font-size:16px;border-radius:8px;transition:0.2s; display:flex;align-items:center;justify-content:center;}
.ic:hover{background:var(--line);color:var(--ac);}

input,select,textarea{font:inherit;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%;transition:0.3s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs);}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px;}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .6s ease;}

/* مؤشرات الأولوية */
.pri-2 {color: var(--urg);} .pri-1 {color: var(--imp);} .pri-0 {color: var(--nor);}

/* الجدول الأسبوعي */
.table-wrapper {overflow-x:auto; background:var(--card); border-radius:16px; border:1px solid var(--line); box-shadow:var(--sh);}
.st-table {width:100%; border-collapse:collapse; min-width:600px;}
.st-th {background:var(--bg); color:var(--mut); padding:16px; text-align:right; font-family:'Cairo'; font-weight:700; border-bottom:2px solid var(--line);}
.st-td {padding:16px; border-bottom:1px solid var(--line); vertical-align:top;}
.st-tr:last-child .st-td {border-bottom:0;}
.st-tr:hover {background:var(--bg);}
.st-day {font-weight:700; font-size:16px; color:var(--ink); display:block;}
.st-date {font-size:12px; color:var(--mut);}

/* العادات */
.habit-grid {display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; margin-top:12px;}
.habit-day {aspect-ratio:1; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--line); color:var(--mut); cursor:pointer; transition:0.2s; font-size:12px; font-weight:bold;}
.habit-day:hover {background:var(--mut); color:#fff;}
.habit-day.active {background:var(--ac); color:#fff; box-shadow:0 0 10px var(--acs);}

/* ======= شاشة التحميل الرومانسية باللون البنفسجي ======= */
#loader {
  position: fixed; inset: 0;
  background: radial-gradient(circle at center, #240046 0%, #10002b 100%);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
  transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.77, 0, 0.175, 1);
  overflow: hidden;
}
.loader-bg-glow {
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(157, 78, 221, 0.2) 0%, transparent 70%);
  border-radius: 50%;
  animation: pulseGlow 4s infinite alternate ease-in-out;
}
.floating-hearts {
  position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none;
}
.floating-hearts i {
  position: absolute; bottom: -50px; left: var(--x);
  color: rgba(224, 170, 255, 0.25);
  font-size: calc(24px * var(--s));
  animation: floatUp 7s linear infinite;
  animation-delay: var(--d);
  filter: drop-shadow(0 0 10px rgba(224, 170, 255, 0.4));
}
.loader-box {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  animation: floatContainer 6s ease-in-out infinite;
}
.pulse-ring {
  position: absolute;
  top: 40%; left: 50%;
  width: 140px; height: 140px;
  border-radius: 50%;
  border: 2px solid rgba(157, 78, 221, 0.6);
  animation: beatingRing 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
  z-index: -1;
}
.pulse-ring.delay { animation-delay: 1.5s; }
#loader-name {
  font-family: 'Playfair Display', serif; 
  font-size: 60px; font-weight: 600; 
  letter-spacing: 12px; margin: 0; 
  background: linear-gradient(90deg, #e0aaff, #c77dff, #e0aaff);
  background-size: 200% auto;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  animation: shineText 4s linear infinite, revealText 2s forwards ease-out;
  text-shadow: 0 0 40px rgba(157, 78, 221, 0.5);
}
.loader-line {
  width: 0; height: 2px;
  background: linear-gradient(90deg, transparent, #c77dff, transparent);
  margin-top: 15px;
  animation: drawLine 2.5s forwards ease 1.5s;
  box-shadow: 0 0 15px #c77dff;
}
#loader-quote {
  margin-top: 25px; color: #e0aaff; font-family: 'Cairo', sans-serif; font-size: 17px; 
  text-align: center; font-weight: 600; opacity: 0; 
  animation: revealQuote 2s forwards ease-out 2s; 
  max-width: 80%; line-height: 1.6;
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 0.8; }
  100% { transform: translateY(-100vh) scale(1.5) rotate(45deg); opacity: 0; }
}
@keyframes beatingRing {
  0% { transform: translate(-50%, -50%) scale(0.6); opacity: 1; border-width: 4px; box-shadow: 0 0 30px rgba(157, 78, 221, 0.5); }
  100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; border-width: 1px; }
}
@keyframes pulseGlow { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.2); opacity: 1; } }
@keyframes floatContainer { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
@keyframes shineText { to { background-position: 200% center; } }
@keyframes revealText { 0% { opacity: 0; transform: translateY(25px); filter: blur(8px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
@keyframes drawLine { to { width: 140px; } }
@keyframes revealQuote { 0% { opacity: 0; transform: translateY(15px); filter: blur(5px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
@keyframes pulse { 0% {transform:scale(1);} 50% {transform:scale(1.1);} 100% {transform:scale(1);}}

#toast{position:fixed;bottom:100px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:14px 28px;border-radius:12px;opacity:0;transition:.4s;pointer-events:none;z-index:105; font-weight:700; box-shadow:0 10px 40px rgba(0,0,0,0.3); display:flex; align-items:center; gap:10px;}
#toast.s{opacity:1; transform:translateY(-15px);}

@media(max-width:760px){
  body{flex-direction:column}
  nav{position:fixed;bottom:0;inset-inline:0;top:auto;width:100%;height:auto;flex-direction:row;justify-content:space-between;padding:12px 8px calc(12px + env(safe-area-inset-bottom,0px));z-index:90;border-top:1px solid var(--line);background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,0.05); overflow-x:auto;}
  nav .logo, nav .sync-badge{display:none}
  nav button{flex:1; flex-direction:column; gap:6px; font-size:11px; padding:8px 6px; border-radius:12px; white-space:nowrap; justify-content:center; font-weight:700;}
  nav button i {font-size:20px;}
  main{padding:16px 12px 110px}
  #loader-quote {font-size:15px;}
  #loader-name {font-size: 45px;}
}
</style>
</head>
<body>
<div id="loader">
  <div class="loader-bg-glow"></div>
  <div class="floating-hearts">
    <i class="fa-solid fa-heart" style="--d: 0s; --x: 15%; --s: 1.2;"></i>
    <i class="fa-solid fa-heart" style="--d: 2s; --x: 85%; --s: 0.8;"></i>
    <i class="fa-solid fa-heart" style="--d: 4s; --x: 50%; --s: 1.5;"></i>
    <i class="fa-solid fa-heart" style="--d: 1s; --x: 30%; --s: 0.9;"></i>
    <i class="fa-solid fa-heart" style="--d: 3s; --x: 70%; --s: 1.1;"></i>
    <i class="fa-solid fa-heart" style="--d: 5s; --x: 10%; --s: 1.3;"></i>
    <i class="fa-solid fa-heart" style="--d: 2.5s; --x: 90%; --s: 1;"></i>
  </div>
  <div class="loader-box">

    <div id="loader-quote"></div>
  </div>
</div>

<nav id="nav"></nav>
<main id="app"></main>
<div id="toast"></div>

<script>
const ACCENTS = [
  { name: 'وردي (الافتراضي)', ac: '#d9658f', acsL: '#fbe3ec', acsD: '#4a2d3d' },
  { name: 'بنفسجي لافندر', ac: '#8b78a5', acsL: '#ece6f7', acsD: '#383050' },
  { name: 'أخضر نعناعي', ac: '#2a9d8f', acsL: '#e2f4f2', acsD: '#1d423e' },
  { name: 'أزرق سماوي', ac: '#457b9d', acsL: '#e1eff7', acsD: '#1f384a' },
  { name: 'خوخي دافئ', ac: '#f4a261', acsL: '#fdf1e8', acsD: '#5e381f' }
];

const quotes = [
  "تذكري دائماً أنكِ قادرة على تحقيق المستحيل 🌟",
  "كل خطوة صغيرة هي تقدم نحو هدفك 🌸",
  "لا تستسلمي، البدايات دائماً هي الأصعب 💪",
  "أنتِ تصنعين مستقبلك اليوم، استمري! ✨",
  "ثقي بنفسك وبقدراتك، العالم يفتح أبوابه لكِ 🌷",
  "ابتسمي.. اليوم سيكون يوماً رائعاً بإذن الله 💖"
];
document.getElementById('loader-quote').textContent = quotes[Math.floor(Math.random() * quotes.length)];

const firebaseConfig = {
  apiKey: "AIzaSyAPlU02h0HsGvD7cq2tRCiN7cDOO2l3Sfo",
  authDomain: "maryam-website-d40ce.firebaseapp.com",
  projectId: "maryam-website-d40ce",
  storageBucket: "maryam-website-d40ce.firebasestorage.app",
  messagingSenderId: "667369258923",
  appId: "1:667369258923:web:e497cb014cba9a356e1cee"
};

let dbFire = null;
let syncState = 'syncing'; // 'online', 'syncing', 'offline'
let initialCloudLoaded = false;

let D = {
  settings: { theme:'light', msg:'أنتِ النور الذي يضيء أيامي، وكل يوم معكِ هو بداية جديدة للجمال.', accent:0, _u: 0 },
  items: [], 
  habits: [], 
  events: [], 
  notes: [],
  deletedIds: [] // لحفظ معرفات العناصر المحذوفة ومنع عودتها عند الدمج بين الأجهزة
};

let editEvId = null;
let editNoteId = null; 

// دالة تحديث حالة المزامنة في الواجهة
function setSyncStatus(st) {
  syncState = st;
  const el = document.getElementById('sync-indicator');
  if(!el) return;
  const labels = { online: 'متصل ومتزامن', syncing: 'جاري المزامنة...', offline: 'أوفلاين (محلي فقط)' };
  el.innerHTML = `<span class="sync-dot ${st}"></span> <span>${labels[st]}</span>`;
}

// دالة الدمج الذكي بين بيانات المتصفح المحلي وبيانات السيرفر (تمنع ضياع أي عنصر)
function mergeData(local, remote) {
  if (!remote) return local;
  
  // توحيد قائمة المحذوفات من الجهازين
  const delSet = new Set([...(local.deletedIds || []), ...(remote.deletedIds || [])]);
  
  // دالة دمج المصفوفات بالاعتماد على الـ ID وأحدث تعديل (_u)
  const mergeArr = (arrL = [], arrR = [], isHabit = false) => {
    const map = new Map();
    [...arrR, ...arrL].forEach(item => {
      if (!item || !item.id || delSet.has(item.id)) return;
      const existing = map.get(item.id);
      if (!existing) {
        map.set(item.id, item);
      } else {
        if (isHabit) {
          // دمج سجلات الأيام في العادات بدون تكرار
          const mergedLogs = Array.from(new Set([...(existing.logs || []), ...(item.logs || [])]));
          const newer = (item._u || 0) >= (existing._u || 0) ? item : existing;
          map.set(item.id, { ...newer, logs: mergedLogs });
        } else {
          // اختيار النسخة الأحدث من العنصر
          if ((item._u || 0) >= (existing._u || 0)) {
            map.set(item.id, item);
          }
        }
      }
    });
    return Array.from(map.values());
  };

  // اختيار الإعدادات الأحدث
  const settingsL = local.settings || {};
  const settingsR = remote.settings || {};
  const mergedSettings = (settingsL._u || 0) > (settingsR._u || 0) 
    ? { ...settingsR, ...settingsL } 
    : { ...settingsL, ...settingsR };

  // دمج وقت التركيز اليومي (نأخذ القيمة الأكبر لليوم الحالي)
  let mergedFocus = local.focus || remote.focus || { date: today(), mins: 0 };
  if (local.focus && remote.focus && local.focus.date === remote.focus.date) {
    mergedFocus = { date: local.focus.date, mins: Math.max(local.focus.mins || 0, remote.focus.mins || 0) };
  } else if (remote.focus && (!local.focus || remote.focus.date > local.focus.date)) {
    mergedFocus = remote.focus;
  }

  return {
    ...remote,
    ...local,
    settings: mergedSettings,
    items: mergeArr(local.items, remote.items),
    habits: mergeArr(local.habits, remote.habits, true),
    events: mergeArr(local.events, remote.events),
    notes: mergeArr(local.notes, remote.notes),
    deletedIds: Array.from(delSet).slice(-500), // الاحتفاظ بآخر 500 معرف محذوف
    focus: mergedFocus,
    _ts: Math.max(local._ts || 0, remote._ts || 0, Date.now())
  };
}

// تنظيف الكائن من أي قيم undefined يرفضها Firestore
const cleanForFirebase = (obj) => JSON.parse(JSON.stringify(obj));

const save = async () => {
  D._ts = Date.now();
  localStorage.setItem('maryam_life_os_v4', JSON.stringify(D));
  
  if (!dbFire) return;
  setSyncStatus('syncing');
  
  try {
    const docRef = dbFire.collection('maryam_app').doc('life_os');
    // إذا لم تكن بيانات السيرفر قد حُملت بعد، نسحبها أولاً وندمجها قبل الرفع حتى لا نمسح بيانات السيرفر
    if (!initialCloudLoaded) {
      const snap = await docRef.get();
      if (snap.exists) {
        D = mergeData(D, snap.data());
        localStorage.setItem('maryam_life_os_v4', JSON.stringify(D));
      }
      initialCloudLoaded = true;
    }
    await docRef.set(cleanForFirebase(D), { merge: true });
    setSyncStatus('online');
  } catch (e) {
    console.error("Firebase Sync Error:", e);
    setSyncStatus('offline');
    toast('تعذرت المزامنة مع السيرفر - تأكد من الإنترنت أو صلاحيات Firebase');
  }
};

// مزامنة يدوية فورية عند الضغط على زر الحالة
async function forceSync() {
  if (!dbFire) return toast('لا يوجد اتصال بقاعدة البيانات');
  setSyncStatus('syncing');
  try {
    const docRef = dbFire.collection('maryam_app').doc('life_os');
    const snap = await docRef.get({ source: 'server' });
    if (snap.exists) {
      D = mergeData(D, snap.data());
      restoreEvents();
      localStorage.setItem('maryam_life_os_v4', JSON.stringify(D));
    }
    await docRef.set(cleanForFirebase(D), { merge: true });
    initialCloudLoaded = true;
    setSyncStatus('online');
    applyTheme();
    render(true);
    toast('تمت المزامنة وتوحيد البيانات بنجاح!');
  } catch (e) {
    console.error(e);
    setSyncStatus('offline');
    toast('فشلت المزامنة الفورية');
  }
}

// استرجاع أي عنصر من memories إلى events بدون مسح
function restoreEvents(){
  if(!Array.isArray(D.memories) || !D.memories.length) return false;
  if(!D.events) D.events = [];
  const delSet = new Set(D.deletedIds || []);
  let n = 0;
  D.memories.forEach(m => {
    if(m && m.id && !delSet.has(m.id) && !D.events.some(e => e.id === m.id)){
      D.events.push({id:m.id, title:m.title, date:m.date, countdown:false, _u: Date.now()});
      n++;
    }
  });
  return n > 0;
}

const load = async () => {
  const loc = localStorage.getItem('maryam_life_os_v4');
  if(loc) {
    try { D = {...D, ...JSON.parse(loc)}; } catch(e) {}
  }
  
  if(!D.settings) D.settings = { theme:'light', msg:'أنتِ النور الذي يضيء أيامي، وكل يوم معكِ هو بداية جديدة للجمال.', accent:0 };
  if(!D.settings.theme || D.settings.theme === 'auto') D.settings.theme = 'light';
  if(typeof D.settings.accent === 'undefined') D.settings.accent = 0;
  
  if(!Array.isArray(D.items)) D.items = [];
  if(!Array.isArray(D.habits)) D.habits = [];
  if(!Array.isArray(D.events)) D.events = [];
  if(!Array.isArray(D.notes)) D.notes = [];
  if(!Array.isArray(D.deletedIds)) D.deletedIds = [];
  
  restoreEvents();
  
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    dbFire = firebase.firestore();
    
    const docRef = dbFire.collection('maryam_app').doc('life_os');
    
    // الاستماع اللحظي لأي تغييرات على السيرفر من أي متصفح أو جهاز آخر
    docRef.onSnapshot(doc => {
      if(doc.exists) {
        const serverData = doc.data();
        const beforeStr = JSON.stringify({i:D.items, h:D.habits, e:D.events, n:D.notes, s:D.settings});
        
        D = mergeData(D, serverData);
        restoreEvents();
        localStorage.setItem('maryam_life_os_v4', JSON.stringify(D));
        
        const afterStr = JSON.stringify({i:D.items, h:D.habits, e:D.events, n:D.notes, s:D.settings});
        const serverStr = JSON.stringify({i:serverData.items||[], h:serverData.habits||[], e:serverData.events||[], n:serverData.notes||[], s:serverData.settings||{}});
        
        // إذا كان الجهاز المحلي يحتوي على إضافات لم تكن على السيرفر، نرفع النسخة المدمجة للسيرفر
        if (!initialCloudLoaded || afterStr !== serverStr) {
          initialCloudLoaded = true;
          docRef.set(cleanForFirebase(D), { merge: true }).catch(e => console.error(e));
        }
        
        initialCloudLoaded = true;
        setSyncStatus('online');
        
        if (beforeStr !== afterStr) {
          applyTheme();
          render(true);
        }
      } else {
        // لو الوثيقة غير موجودة أصلاً على السيرفر، نرفع البيانات المحلية لأول مرة
        initialCloudLoaded = true;
        save();
      }
    }, err => {
      console.error("Firestore Snapshot Error:", err);
      setSyncStatus('offline');
    });
  } catch(e) {
    console.error("Firebase Init Error:", e);
    setSyncStatus('offline');
  }
};

// دالة مساعدة لتسجيل الحذف ومنع رجوع العنصر من جهاز آخر
function markDeleted(id) {
  if (!D.deletedIds) D.deletedIds = [];
  if (!D.deletedIds.includes(id)) D.deletedIds.push(id);
}

function openEditTask(id){
  const i=D.items.find(x=>x.id==id); if(!i) return;
  editTaskId=id; page='tasks'; render();
  $('#ti-title').value=i.title; $('#ti-cat').value=i.cat; $('#ti-pri').value=i.pri; $('#ti-date').value=i.date;
  $('#ti-time').value=i.time||''; $('#ti-dur').value=i.dur||''; $('#ti-recur').value=i.recur||'none';
  $('#ti-subs').value=(i.subs||[]).map(s=>s.text).join('\n'); scrollTo(0,0);
}
function saveTask(){
  const t=$('#ti-title').value.trim(); if(!t) return toast('اكتبي اسم المهمة');
  const old=editTaskId?D.items.find(x=>x.id==editTaskId):null;
  const subs=$('#ti-subs').value.split('\n').filter(x=>x.trim()).map(x=>({text:x.trim(), done:!!(old&&(old.subs||[]).find(o=>o.text==x.trim()&&o.done))}));
  const f={title:t, cat:$('#ti-cat').value, pri:+$('#ti-pri').value, date:$('#ti-date').value, time:$('#ti-time').value, dur:+$('#ti-dur').value, recur:$('#ti-recur').value, subs, _u:Date.now()};
  if(old){Object.assign(old,f); editTaskId=null; toast('تم تعديل المهمة');}
  else {D.items.push({id:uid(), ...f, done:false}); toast('تم إضافة المهمة');}
  save(); render();
}
function exportData(){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));
  a.download='maryam-life-backup-'+today()+'.json'; a.click();
}
function importData(f){
  if(!f) return; const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result); if(confirm('سيتم دمج وتحديث البيانات بالنسخة المستوردة. متأكدة؟')){D=mergeData(D,x); save(); applyTheme(); render(); toast('تم استيراد ودمج البيانات');}}catch(e){toast('الملف غير صالح');}};
  r.readAsText(f);
}
function toggleTask(id, checked) {
  let it = D.items.find(x=>x.id==id);
  if(!it) return;
  it.done = checked;
  it._u = Date.now();
  if(checked && it.recur && it.recur !== 'none' && !it.spawned){
    it.spawned = true;
    let nxt;
    if(it.recur=='monthly'){const x=new Date(it.date+'T12:00'); x.setMonth(x.getMonth()+1); nxt=iso(x);} else nxt = addDays(it.date, it.recur=='daily'?1:7);
    D.items.push({...it, id:uid(), done:false, spawned:false, date:nxt, _u:Date.now(), subs:(it.subs||[]).map(s=>({text:s.text, done:false}))});
    toast('تم إنجاز المهمة، وجدولتها للمرة القادمة!');
  }
  save(); render();
}

function toggleSub(tid, idx, checked) {
  let it = D.items.find(x=>x.id==tid);
  if(!it || !it.subs[idx]) return;
  it.subs[idx].done = checked;
  it._u = Date.now();
  save(); render(true);
}

function postpone(id) {
  let it = D.items.find(x=>x.id==id);
  if(!it) return;
  it.date = addDays(it.date, 1);
  it._u = Date.now();
  toast('تم التأجيل للغد'); save(); render();
}

function del(id) {
  if(confirm('هل متأكد من الحذف؟')){
    markDeleted(id);
    D.items = D.items.filter(x=>x.id!=id); 
    save(); toast('تم الحذف'); render();
  }
}

function toggleHabit(id, d) {
  let h = D.habits.find(x=>x.id==id);
  if(!h) return;
  if(h.logs.includes(d)) h.logs = h.logs.filter(x=>x!=d); else h.logs.push(d);
  h._u = Date.now();
  save(); render();
}
function getStreak(h) {
  let s=0, d=today();
  if(!h.logs.includes(d)) d=addDays(d,-1);
  while(h.logs.includes(d)){ s++; d=addDays(d,-1); }
  return s;
}

            const dayItems = D.items.filter(x => x.date == d).sort((a,b)=>b.pri-a.pri || (a.time||'99').localeCompare(b.time||'99'));
            const dDone = dayItems.filter(x=>x.done).length, dTotal = dayItems.length;
            return `
            <tr class="st-tr" style="${d==t ? 'background:var(--acs);' : ''}">
              <td class="st-td"><span class="st-day">${d==t ? 'اليوم' : fmtDay(d)}</span><span class="st-date">${fmtDate(d)}</span></td>
              <td class="st-td">
                ${dTotal === 0 ? '<span class="mut">يوم مفتوح!</span>' : `
                  <div style="display:flex; flex-direction:column; gap:8px;">
                    ${dayItems.map(i => `
                      <div class="row ${i.done?'done-row':''}" style="background:var(--bg); border:1px solid var(--line);">
                        <input type="checkbox" style="width:18px;height:18px;accent-color:var(--ac);" ${i.done?'checked':''} onchange="toggleTask('${i.id}', this.checked)">
                        <div class="t">
                          <div class="t-title" style="font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px;">${getPriIcon(i.pri)} ${esc(i.title)}</div>
                          <div class="mut" style="font-size:11px; margin-top:2px;">${catIcon(i.cat)} ${i.time||'طوال اليوم'}</div>
                        </div>
                        <button class="ic" onclick="del('${i.id}')" title="حذف المهمة"><i class="fa-solid fa-trash-can"></i></button>
                      </div>
                    `).join('')}
                  </div>
                `}
              </td>
              <td class="st-td" style="vertical-align:middle; text-align:center;">
                ${dTotal > 0 ? `<div style="font-weight:700; color:var(--ac);">${pct(dDone, dTotal)}٪</div>${bar(pct(dDone, dTotal))}` : '-'}
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  },

  habits(){
    const t = today(), w = [...Array(7)].map((_,i)=>addDays(t,i-6+hOff*7)); 
    return `<h1><i class="fa-solid fa-seedling"></i> متتبع العادات</h1>
    <p class="mut" style="margin-bottom:20px;">الاستمرارية هي سر النجاح. تابعي عاداتك اليومية وحافظي على سلسلتك!</p>
    
    <div class="card f" style="align-items:center;">
      <input id="h-name" placeholder="اسم العادة (مثل: شرب 2لتر ماء، قراءة، رياضة)">
      <button class="btn" onclick="let n=$('#h-name').value.trim(); if(n){D.habits.push({id:uid(), name:n, logs:[], _u:Date.now()}); save(); render();}"><i class="fa-solid fa-plus"></i> إضافة عادة</button>
    </div>
    
    <div style="display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:14px;">
      <button class="ic" onclick="hOff--;render()" title="أسبوع أسبق"><i class="fa-solid fa-chevron-right"></i></button>
      <span class="mut" style="font-weight:700;">${fmtDate(w[0])} - ${fmtDate(w[6])}</span>
      <button class="ic" onclick="if(hOff<0){hOff++;render()}" title="الأسبوع التالي"><i class="fa-solid fa-chevron-left"></i></button>
    </div>
    <div class="grid">
      ${D.habits.length ? D.habits.map(h=>{
        const strk = getStreak(h);
        return `
        <div class="card" style="padding:18px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <h3 style="font-size:18px; margin-bottom:4px;">${esc(h.name)}</h3>
              <div style="font-size:13px; font-weight:700; color:${h.logs.length?'var(--ac)':'var(--mut)'};"><i class="fa-solid fa-circle-check"></i> أيام الإنجاز: ${h.logs.length} يوم &nbsp;|&nbsp; ${w.filter(d=>h.logs.includes(d)).length}/7 في هذا الأسبوع${strk>1?` &nbsp;|&nbsp; <i class="fa-solid fa-fire"></i> ${strk} متتالية`:''}</div>
            </div>
            <button class="ic" onclick="if(confirm('حذف العادة؟')){markDeleted('${h.id}'); D.habits=D.habits.filter(x=>x.id!='${h.id}'); save(); render();}"><i class="fa-solid fa-trash-can"></i></button>
          </div>
          <div class="habit-grid">
            ${w.map(d=>`
              <div class="habit-day ${h.logs.includes(d)?'active':''}" onclick="toggleHabit('${h.id}','${d}')" title="${fmtDate(d)}">
                ${d.split('-')[2]}
              </div>
            `).join('')}
          </div>
        </div>`;
      }).join('') : '<p class="mut">لا توجد عادات بعد. ابدئي بعادة صغيرة الآن!</p>'}
    </div>`;
  },
  
  events(){
    const t = today();
    const sorted = [...D.events].sort((a,b)=>a.date.localeCompare(b.date));
    const evToEdit = editEvId ? D.events.find(x => x.id === editEvId) : null;

    return `<h1><i class="fa-solid fa-calendar-days"></i> المناسبات</h1>
    <p class="mut" style="margin-bottom:20px;">احتفظي بتواريخ اللحظات المميزة وتابعي الأيام المتبقية لها.</p>

    <div class="card">
      <h3 style="margin-bottom:15px; font-size:16px;">
        <i class="fa-solid ${evToEdit ? 'fa-pen' : 'fa-plus'}"></i> 
        ${evToEdit ? 'تعديل المناسبة' : 'إضافة مناسبة جديدة'}
      </h3>
      <div class="f" style="align-items: center;">
        <input id="ev-title" placeholder="اسم المناسبة (مثال: عيد ميلاد، تخرج، ذكرى...)" value="${evToEdit ? esc(evToEdit.title) : ''}">
        <input id="ev-date" type="date" value="${evToEdit ? evToEdit.date : t}">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:700;">
          <input id="ev-cd" type="checkbox" style="width:20px;height:20px;accent-color:var(--ac);" ${(!evToEdit || evToEdit.countdown) ? 'checked' : ''}>
          تفعيل العداد التنازلي
        </label>
      </div>
      <div style="text-align:left; display:flex; gap:10px; justify-content:flex-end;">
        ${evToEdit ? `<button class="btn g" onclick="cancelEditEv()">إلغاء</button>` : ''}
        <button class="btn" onclick="saveEv()">
          <i class="fa-solid ${evToEdit ? 'fa-check' : 'fa-plus'}"></i> 
          ${evToEdit ? 'حفظ التعديلات' : 'إضافة للمناسبات'}
        </button>
      </div>
    </div>

    <div class="grid" style="margin-top:20px;">
      ${sorted.length ? sorted.map(e => {
        const daysLeft = diffDays(t, e.date);
        const isPast = daysLeft < 0;
        const isToday = daysLeft === 0;

        return `
        <div class="card card-hover" style="text-align:center; padding:35px 20px; border-top: 5px solid var(--ac); background: linear-gradient(180deg, var(--card) 0%, var(--acs) 150%); position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:center;">
          <div style="position:absolute; top:15px; left:15px; display:flex; gap:5px;">
            <button class="ic" onclick="openEditEv('${e.id}')" title="تعديل"><i class="fa-solid fa-pen"></i></button>
            <button class="ic" onclick="if(confirm('هل أنتِ متأكدة من حذف هذه المناسبة؟')){markDeleted('${e.id}'); D.events=D.events.filter(x=>x.id!='${e.id}'); save(); render();}" title="حذف"><i class="fa-solid fa-trash-can"></i></button>
          </div>
          <div style="font-size:22px; font-weight:800; color:var(--ac); margin-bottom:10px; font-family:'Cairo';">${esc(e.title)}</div>
          <div class="mut" style="margin-bottom:15px; font-size:14px;"><i class="fa-regular fa-calendar"></i> ${fmtDay(e.date)}، ${fmtDate(e.date)}</div>
          ${e.countdown ? `
            <div style="margin-top:10px;">
              ${isPast ? `<div style="font-size:16px; color:var(--mut); font-weight:bold;">مرت منذ ${Math.abs(daysLeft)} يوم</div>` :
                isToday ? `<div style="font-size:24px; font-weight:800; color:var(--urg); animation: pulse 2s infinite;">اليوم هو الموعد! 🎉</div>` :
                `<div style="display:inline-block; background:var(--card); border:2px solid var(--acs); border-radius:20px; padding:15px 30px; box-shadow:0 8px 25px rgba(0,0,0,0.1);">
                  <div style="font-size:42px; font-weight:800; color:var(--ac); font-family:'Cairo'; line-height:1;">${daysLeft}</div>
                  <div style="font-size:15px; color:var(--ink); font-weight:700; margin-top:5px;">يوماً متبقياً</div>
                </div>`
              }
            </div>
          ` : ''}
        </div>
        `;
      }).join('') : '<p class="mut" style="text-align:center; width:100%; grid-column:1/-1;">لا توجد مناسبات مضافة حالياً. سجلي مناسباتك السعيدة هنا!</p>'}
    </div>
    `;
  },
  
  notes() {
    const sorted = [...D.notes].sort((a,b)=>(b.ts||0)-(a.ts||0) || b.date.localeCompare(a.date));
    const nToEdit = editNoteId ? D.notes.find(x => x.id === editNoteId) : null;
    
    return `
    <h1><i class="fa-solid fa-book-open"></i> المذكرات واليوميات</h1>
    <p class="mut" style="margin-bottom:20px;">مساحتك الخاصة لتفريغ أفكارك، كتابة يومياتك، أو ما تشعرين بالامتنان تجاهه.</p>

    <div class="card">
      <h3 style="margin-bottom:15px; font-size:16px;">
        <i class="fa-solid ${nToEdit ? 'fa-pen' : 'fa-plus'}"></i> 
        ${nToEdit ? 'تعديل المذكرة' : 'مذكرة جديدة'}
      </h3>
      <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:15px;">
        <input id="n-title" placeholder="العنوان (اختياري، مثلاً: أفكار الصباح، امتنان اليوم)" value="${nToEdit ? esc(nToEdit.title) : ''}">
        <textarea id="n-content" rows="4" placeholder="اكتبي ما يدور في ذهنك هنا بحرية...">${nToEdit ? esc(nToEdit.content) : ''}</textarea>
      </div>
      <div style="text-align:left; display:flex; gap:10px; justify-content:flex-end;">
        ${nToEdit ? `<button class="btn g" onclick="cancelEditNote()">إلغاء التعديل</button>` : ''}
        <button class="btn" onclick="saveNote()">
          <i class="fa-solid ${nToEdit ? 'fa-check' : 'fa-floppy-disk'}"></i> 
          ${nToEdit ? 'حفظ التعديلات' : 'حفظ المذكرة'}
        </button>
      </div>
    </div>

    <div class="grid" style="margin-top:20px;">
      ${sorted.length ? sorted.map(n => `
        <div class="card card-hover" style="display:flex; flex-direction:column; gap:12px; align-items:flex-start;">
          <div style="width:100%; display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:5px;">
            <div>
              <h3 style="font-size:18px; color:var(--ac); margin-bottom:5px;">${n.title ? esc(n.title) : 'بدون عنوان'}</h3>
              <div class="mut" style="font-size:12px;"><i class="fa-regular fa-clock"></i> ${fmtDay(n.date)}، ${fmtDate(n.date)} - ${n.time||''}</div>
            </div>
            <div style="display:flex; gap:5px;">
              <button class="ic" onclick="openEditNote('${n.id}')" title="تعديل"><i class="fa-solid fa-pen"></i></button>
              <button class="ic" onclick="if(confirm('هل أنتِ متأكدة من حذف هذه المذكرة؟')){markDeleted('${n.id}'); D.notes=D.notes.filter(x=>x.id!='${n.id}'); save(); render();}" title="حذف"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <div style="white-space:pre-wrap; line-height:1.7; font-size:15px; color:var(--ink); flex:1; width:100%;">${esc(n.content)}</div>
        </div>
      `).join('') : '<p class="mut" style="text-align:center; width:100%; grid-column:1/-1;">لا توجد مذكرات بعد. ابدئي بتدوين يومياتك وخواطرك!</p>'}
    </div>
    `;
  },

  timer(){
    return `<h1><i class="fa-solid fa-stopwatch"></i> مؤقت التركيز (بومودورو)</h1>
    <p class="mut" style="margin-bottom:24px;">قسّمي وقت عملك لفترات للحفاظ على نشاطك. تركيزك اليوم: ${(D.focus&&D.focus.date==today())?D.focus.mins:0} دقيقة</p>
    <div class="card" style="text-align:center; padding:50px 20px;">
      <div id="tt-display" style="font-size:80px; font-weight:700; font-family:'Cairo'; color:var(--ac); line-height:1; margin-bottom:30px;">25:00</div>
      <div style="display:flex; gap:16px; justify-content:center; flex-wrap:wrap;">
        <button class="btn" onclick="startTimer(25)"><i class="fa-solid fa-brain"></i> تركيز (25 د)</button>
        <button class="btn g" onclick="startTimer(5)"><i class="fa-solid fa-mug-hot"></i> راحة (5 د)</button>
        <button class="ic" style="background:var(--line); padding:14px 20px; color:var(--ink);" onclick="stopTimer()" title="إيقاف"><i class="fa-solid fa-stop"></i></button>
      </div>
    </div>`;
  },

  themes(){
    return `
    <h1><i class="fa-solid fa-palette"></i> المظهر (Themes)</h1>
    <p class="mut" style="margin-bottom:20px;">خصصي شكل وألوان التطبيق ليناسب ذوقك.</p>

    <div class="card">
      <h3 style="margin-bottom:15px; font-size:16px;"><i class="fa-solid fa-circle-half-stroke"></i> وضع الإضاءة</h3>
      <div style="display:flex; gap:15px;">
        <button class="btn ${D.settings.theme==='light' ? '' : 'g'}" onclick="setMode('light')">
          <i class="fa-solid fa-sun"></i> الوضع الفاتح
        </button>
        <button class="btn ${D.settings.theme==='dark' ? '' : 'g'}" onclick="setMode('dark')">
          <i class="fa-solid fa-moon"></i> الوضع الداكن
        </button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:15px; font-size:16px;"><i class="fa-solid fa-droplet"></i> الألوان (Accents)</h3>
      <div style="display:flex; gap:15px; flex-wrap:wrap; padding:10px 0;">
        ${ACCENTS.map((c, i) => `
          <div onclick="setAccent(${i})" 
               style="width:50px; height:50px; border-radius:50%; background:${c.ac}; cursor:pointer; 
                      border:3px solid ${D.settings.accent === i ? 'var(--ink)' : 'transparent'}; 
                      box-shadow:0 4px 10px rgba(0,0,0,0.1); transition:0.3s; 
                      transform:${D.settings.accent === i ? 'scale(1.15)' : 'scale(1)'};" 
               title="${c.name}">
          </div>
        `).join('')}
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:15px; font-size:16px;"><i class="fa-solid fa-floppy-disk"></i> نسخة احتياطية ومزامنة</h3>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <button class="btn" onclick="forceSync()"><i class="fa-solid fa-rotate"></i> مزامنة فورية مع السيرفر</button>
        <button class="btn g" onclick="exportData()"><i class="fa-solid fa-download"></i> تصدير بياناتي</button>
        <label class="btn g" style="cursor:pointer;"><i class="fa-solid fa-upload"></i> استيراد<input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label>
      </div>
    </div>
    `;
  }
};

let timerInterval=null, timeRemaining=0, timerEnd=0, timerLen=0;
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain(); o.connect(g); g.connect(a.destination); g.gain.value=.15; o.frequency.value=880; o.start(); o.stop(a.currentTime+.6);}catch(e){}}
function startTimer(minutes){
  clearInterval(timerInterval);
  timerLen=minutes; timerEnd=Date.now()+minutes*60000; timeRemaining=minutes*60;
  updateTimerDisplay();
  timerInterval=setInterval(tickTimer,500);
}
function tickTimer(){
  timeRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));
  updateTimerDisplay();
  if(timeRemaining<=0){
    clearInterval(timerInterval);
    if(timerLen>=25){const t=today(); if(!D.focus||D.focus.date!=t) D.focus={date:t,mins:0}; D.focus.mins+=timerLen; save();}
    beep(); navigator.vibrate&&navigator.vibrate([300,150,300]);
    toast('انتهى الوقت المخصص! عمل رائع.');
  }
}
function stopTimer(){clearInterval(timerInterval); timeRemaining=0; updateTimerDisplay();}
function updateTimerDisplay(){
  const el = document.getElementById('tt-display');
  if(!el) return;
  if(timeRemaining === 0) { el.textContent = "00:00"; return; }
  const m = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
  const s = String(timeRemaining % 60).padStart(2, '0');
  el.textContent = `${m}:${s}`;
}

function setAccent(idx) {
  D.settings.accent = idx;
  D.settings._u = Date.now();
  save(); applyTheme(); render(); 
}

function setMode(m) {
  D.settings.theme = m;
  D.settings._u = Date.now();
  save(); applyTheme(); render();
}

function applyTheme(){
  const r = document.documentElement;
  let t = D.settings.theme || 'light';
  r.dataset.theme = t;
  
  let accIdx = D.settings.accent !== undefined ? D.settings.accent : 0;
  let c = ACCENTS[accIdx] || ACCENTS[0];
  r.style.setProperty('--ac', c.ac);
  r.style.setProperty('--acs', t === 'dark' ? c.acsD : c.acsL);
}

function render(keep){
  const labels = { online: 'متصل ومتزامن', syncing: 'جاري المزامنة...', offline: 'أوفلاين (محلي فقط)' };
  $('#nav').innerHTML=`
    <div class="logo">Maryam Life</div>
    <div id="sync-indicator" class="sync-badge" onclick="forceSync()" title="اضغط للمزامنة الفورية">
      <span class="sync-dot ${syncState}"></span> <span>${labels[syncState]}</span>
    </div>` + 
    PAGES.map(([k, icon, l])=>`<button class="${k==page?'on':''}" onclick="go('${k}')"><i class="fa-solid ${icon}"></i> <span>${l}</span></button>`).join('');
    
  const kv={}; if(keep) document.querySelectorAll('#app [id]').forEach(e=>{if(e.id&&e.type!=='checkbox'&&'value' in e) kv[e.id]=e.value});
  const st=window.scrollY; $('#app').innerHTML=views[page](); window.scrollTo(0,st);
  for(const k in kv){const e=document.getElementById(k); if(e&&kv[k]!=='') e.value=kv[k];}
  if(page === 'timer' && timeRemaining > 0) updateTimerDisplay();
}

load().then(()=>{applyTheme(); render()});
</script>
</body>
</html>
